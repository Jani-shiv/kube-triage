# .goreleaser.yaml
version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: "kube-triage"
    main: ./cmd/main.go
    binary: kube-triage
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    hooks:
      post:
        - command: "cp ./README.md {{.ArtifactDir}}/README.md"

archives:
  - id: "kube-triage"
    builds:
      - kube-triage
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
    files:
      - README.md
      - LICENSE
      - configs/heuristic-rules.yaml

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Jani-shiv
    name: kube-triage
  draft: false
  prerelease: auto

nfpms:
  - id: "kube-triage"
    builds:
      - kube-triage
    package_name: kube-triage
    maintainer: "Shiv Jani <shiv@example.com>"
    description: "AI-powered Kubernetes diagnostic engine"
    vendor: "kube-triage"
    homepage: "https://github.com/Jani-shiv/kube-triage"
    license: "MIT"
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin

brew:
  github:
    owner: Jani-shiv
    name: homebrew-tap
  directory: Formula
  commit_author:
    name: goreleaserbot
    email: goreleaser@goreleaser.com
  description: "AI-powered Kubernetes diagnostic engine"
  homepage: "https://github.com/Jani-shiv/kube-triage"
  license: "MIT"
  install: |
    bin.install "kube-triage"
  test: |
    system "#{bin}/kube-triage", "version"